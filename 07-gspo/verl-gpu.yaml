algorithm: gspo
backend: verl
model: Qwen/Qwen2.5-0.5B-Instruct
device: cuda
dataset: data/dapo/train.jsonl
eval_dataset: data/dapo/eval.jsonl
steps: 20
batch_size: 1
group_size: 4
max_new_tokens: 256
max_turns: 8
learning_rate: 5.0e-06
beta: 0.0
seed: 42
cpu_threads: 2
clip_low: 0.0003
clip_high: 0.0004
loss: grpo
verl_workers: 2
micro_batch_size: 1
verl_nodes: 1
rollout_engine: vllm
rollout_tensor_parallel_size: 1
rollout_gpu_memory_utilization: 0.5
max_context_tokens: 4096
gradient_checkpointing: false
