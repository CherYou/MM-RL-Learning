algorithm: vision-grpo
backend: verl
model: Qwen/Qwen2.5-VL-3B-Instruct
device: cuda
dataset: data/geoqa/train.jsonl
eval_dataset: data/geoqa/eval.jsonl
steps: 20
batch_size: 1
group_size: 4
max_new_tokens: 256
max_turns: 8
learning_rate: 5.0e-06
beta: 0.0
seed: 42
cpu_threads: 2
verl_workers: 2
micro_batch_size: 1
verl_nodes: 1
rollout_engine: vllm
rollout_tensor_parallel_size: 1
rollout_gpu_memory_utilization: 0.5
max_context_tokens: 4096
gradient_checkpointing: false
