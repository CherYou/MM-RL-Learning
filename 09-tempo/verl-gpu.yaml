algorithm: tempo
backend: verl
model: Qwen/Qwen2.5-0.5B-Instruct
device: cuda
dataset: data/alfworld-manifests/train.jsonl
eval_dataset: data/alfworld-manifests/eval-unseen.jsonl
steps: 20
batch_size: 1
group_size: 4
max_new_tokens: 96
max_turns: 50
learning_rate: 5.0e-06
beta: 0.0
seed: 42
cpu_threads: 2
environment: alfworld
macro_horizon: 4
critic_samples: 4
critic_tokens: 128
warmup_steps: 2
verl_workers: 2
micro_batch_size: 1
verl_nodes: 1
rollout_engine: vllm
rollout_tensor_parallel_size: 1
rollout_gpu_memory_utilization: 0.5
max_context_tokens: 4096
gradient_checkpointing: false
