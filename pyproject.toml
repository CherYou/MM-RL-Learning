[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rl-lab-local"
version = "0.1.0"
description = "Local PyTorch / TRL learning reproductions of agentic RL algorithms"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.9,<2.10", "torchvision>=0.24,<0.25", "trl==0.25.1",
  "transformers==4.57.6", "accelerate==1.12.0", "peft==0.18.1",
  "datasets==4.4.2", "numpy>=1.26.4,<3", "PyYAML==6.0.3",
  "tensorboard==2.20.0", "streamlit==1.52.2", "matplotlib==3.10.8",
  "alfworld==0.4.2", "spacy>=3.7.5,<3.9",
  "math-verify==0.9.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.10", "uv==0.12.11"]
cpu = ["torch==2.9.1+cpu", "torchvision==0.24.1+cpu", "numpy==2.2.6", "spacy==3.8.11"]
gpu = ["torch==2.9.0+cu129", "torchvision==0.24.0+cu129"]
embodied = ["gymnasium==1.3.0", "gymnasium-robotics==1.4.2", "mujoco==3.3.7"]

[project.scripts]
arl = "agentic_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{extra="cpu"}, {extra="gpu"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index="pytorch-cpu",extra="cpu"},{index="pytorch-cu129",extra="gpu"}]
torchvision = [{index="pytorch-cpu",extra="cpu"},{index="pytorch-cu129",extra="gpu"}]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
