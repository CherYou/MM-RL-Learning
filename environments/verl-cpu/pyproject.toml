[project]
name = "agentic-rl-verl-cpu"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentic-rl-lab-local",
  "torch==2.9.1+cpu",
  "torchvision==0.24.1+cpu",
  "verl==0.7.1",
  "numpy==1.26.4",
  "spacy==3.7.5",
  "ray[default]==2.49.2",
  "tensordict==0.10.0",
  "hydra-core==1.3.2",
  "torchdata==0.11.0",
  "qwen-vl-utils==0.0.14",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.10",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
agentic-rl-lab-local = { path = "../..", editable = true }
verl = { path = "../../references/verl", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
