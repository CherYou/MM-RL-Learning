# Functional single-GPU validation. Select the physical device with
# scripts/run_grpo_gpu_check.py --gpu-index; the process sees it as cuda:0.
algorithm: grpo
backend: verl
model: models/Qwen--Qwen2.5-0.5B-Instruct
device: cuda
dataset: data/gsm8k/train.jsonl
eval_dataset: data/gsm8k/eval.jsonl
reward: math
steps: 3
batch_size: 2
group_size: 8
max_new_tokens: 512
max_context_tokens: 2048
max_turns: 1
learning_rate: 5.0e-6
beta: 0.0
seed: 42
cpu_threads: 4
verl_workers: 1
verl_nodes: 1
micro_batch_size: 1
ppo_epochs: 1
rollout_engine: vllm
rollout_tensor_parallel_size: 1
rollout_gpu_memory_utilization: 0.35
gradient_checkpointing: false
save_every: 10
