name: mechanism

# Heavier checks are opt-in: they need a prepared .venv, optional verl/env
# stacks, and are NOT required for ordinary documentation PRs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/agentic_rl/**"
      - "tests/**"
      - "environments/**"
      - ".github/workflows/mechanism.yml"

jobs:
  pytest-src:
    name: Repository pytest (if venv scripts available)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Note
        run: |
          echo "This job documents the intended mechanism layer."
          echo "Full make check requires scripts/setup.sh and project lockfile deps."
          echo "Status is not treated as L2/L3 capability evidence."
      - name: Collect-only if torch available
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch pytest pillow
          python -m pytest -q tests/test_loss_math_walkthrough.py || true
