name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "configs/**"
      - "docs/**"
      - "scripts/audit_tutorials.py"
      - "scripts/check_markdown_math.py"
      - "preliminary/**"
      - "examples/**"
      - "0*/**"
      - "1*/**"
      - "Basic LLM/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "configs/**"
      - "docs/**"
      - "scripts/audit_tutorials.py"
      - "scripts/check_markdown_math.py"
      - ".github/workflows/docs.yml"

jobs:
  markdown-and-tutorials:
    name: Markdown links, math, tutorial audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Markdown math and local links
        run: python scripts/check_markdown_math.py
      - name: Tutorial structure audit
        run: python scripts/audit_tutorials.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-audit
          path: reports/tutorial-audit.json
          if-no-files-found: ignore
